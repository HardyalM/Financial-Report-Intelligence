name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scope checks compare against main

      - uses: astral-sh/setup-uv@v6

      - name: Install Python 3.12 and dependencies
        run: |
          uv python install 3.12
          if [ -f uv.lock ]; then uv sync --locked; else uv sync; fi

      - name: Standard gate G1 and G5 (lint, typecheck, test, contract drift, scope file, web guard)
        run: make ci

      - name: Session scope G2-G4 on milestone branches (m0, m2.1, ...)
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [[ "$BRANCH" =~ ^m[0-9]+(\.[0-9]+)?$ ]]; then
            git fetch --no-tags origin main:refs/remotes/origin/main 2>/dev/null || true
            uv run python scripts/check_scope.py "${BRANCH^^}" --base origin/main
          else
            echo "Not a milestone branch; G2-G4 skipped."
          fi

      - name: M0 gate - no parsing or LLM imports before their milestones
        if: ${{ (github.head_ref || github.ref_name) == 'm0' }}
        run: uv run python scripts/check_imports.py --forbid fitz,pdfplumber,httpx,anthropic,voyageai
