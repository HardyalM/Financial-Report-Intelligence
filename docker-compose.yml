services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: finintel
      POSTGRES_PASSWORD: finintel
      POSTGRES_DB: finintel
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finintel -d finintel"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  dbdata:
