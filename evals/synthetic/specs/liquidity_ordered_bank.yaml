# Hazard: a bank. Liquidity-ordered balance sheet with loans and advances to customers and
# customer deposits; income statement led by net interest income. Document type bank; revenue,
# current assets and current liabilities are null by design downstream.
# Figures are fictional and exist only because this spec prints them.
name: liquidity_ordered_bank
hazard: liquidity-ordered balance sheet (bank)
description: Bank layout; document type bank, classification false.
chrome: [Strategic report, Risk management, Financial statements]
folio_offset: -200  # printed folios 201-203: too few pages to infer an offset
pages:
  - kind: narrative
    header: Strategic report
    title: Group Chief Executive's statement

  - kind: statement
    statement: income_statement
    title: Consolidated income statement
    subtitle: For the year ended 31 December 2025
    rows:
      - {label: Interest income, note: "5", values: ["4,000", "3,600"]}
      - {label: Interest expense, note: "5", values: ["(1,800)", "(1,500)"]}
      - {label: Net interest income, style: subtotal, values: ["2,200", "2,100"],
         sum_of: [Interest income, Interest expense]}
      - {label: Net fee and commission income, note: "6", values: ["500", "480"]}
      - {label: Total income, style: subtotal, values: ["2,700", "2,580"],
         sum_of: [Net interest income, Net fee and commission income]}
      - {label: Operating expenses, note: "7", values: ["(1,500)", "(1,450)"]}
      - {label: Impairment charge, note: "8", values: ["(200)", "(180)"]}
      - {label: Profit before tax, style: subtotal, values: ["1,000", "950"],
         sum_of: [Total income, Operating expenses, Impairment charge]}
      - {label: Tax expense, note: "9", values: ["(250)", "(240)"]}
      - {label: Profit for the year, style: total, values: ["750", "710"],
         sum_of: [Profit before tax, Tax expense]}

  - kind: statement
    statement: balance_sheet
    title: Consolidated balance sheet
    subtitle: At 31 December 2025
    rows:
      - {label: Assets, style: section}
      - {label: Cash and balances at central banks, note: "10", values: ["5,000", "4,800"]}
      - {label: Loans and advances to banks, note: "11", values: ["2,000", "2,100"]}
      - {label: Loans and advances to customers, note: "12", values: ["40,000", "38,500"]}
      - {label: Debt securities, note: "13", values: ["6,000", "5,900"]}
      - {label: Total assets, style: total, values: ["53,000", "51,300"],
         sum_of: [Cash and balances at central banks, Loans and advances to banks,
                  Loans and advances to customers, Debt securities]}
      - {label: Liabilities, style: section}
      - {label: Deposits from banks, note: "14", values: ["1,500", "1,600"]}
      - {label: Customer deposits, note: "15", values: ["42,000", "40,500"]}
      - {label: Debt securities in issue, note: "16", values: ["5,500", "5,300"]}
      - {label: Total liabilities, style: total, values: ["49,000", "47,400"],
         sum_of: [Deposits from banks, Customer deposits, Debt securities in issue]}
      - {label: Equity, style: section}
      - {label: Share capital, values: ["1,000", "1,000"]}
      - {label: Retained earnings, values: ["3,000", "2,900"]}
      - {label: Total equity, style: total, values: ["4,000", "3,900"],
         sum_of: [Share capital, Retained earnings]}

expect:
  statements:
    income_statement: {pages: [2], scope: group}
    balance_sheet: {pages: [3], scope: group}
  document_type: bank
  balance_sheet_classified: false
  currency: GBP
  unit_scale: 1000000
  periods:
    - {id: FY2025, end_date: "2025-12-31"}
    - {id: FY2024, end_date: "2024-12-31"}
