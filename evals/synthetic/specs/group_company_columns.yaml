# Hazard: Group and Company columns side by side on one balance sheet ("Balance sheets"). Only
# the Group columns may feed the pack; the Company columns are excluded, with their reason.
# Figures are fictional and exist only because this spec prints them.
name: group_company_columns
hazard: Group | Company columns
description: Balance sheet with Group 2025, Group 2024, Company 2025, Company 2024 columns.
chrome: [Strategic report, Financial statements]
pages:
  - kind: narrative
    title: Chief Executive's review
  - kind: statement
    statement: income_statement
    title: Consolidated income statement
    subtitle: For the year ended 31 December 2025
    rows:
      - {label: Revenue, values: ["4,000", "3,800"]}
      - {label: Operating costs, values: ["(3,400)", "(3,260)"]}
      - {label: Operating profit, style: subtotal, values: ["600", "540"], sum_of: [Revenue, Operating costs]}
      - {label: Taxation, values: ["(150)", "(135)"]}
      - {label: Profit for the year, style: total, values: ["450", "405"], sum_of: [Operating profit, Taxation]}
  - kind: statement
    statement: balance_sheet
    title: Balance sheets
    subtitle: As at 31 December 2025
    notes_header: null
    columns:
      - {period: "2025", entity: Group}
      - {period: "2024", entity: Group}
      - {period: "2025", entity: Company}
      - {period: "2024", entity: Company}
    rows:
      - {label: Non-current assets, style: section}
      - {label: "Property, plant and equipment", values: ["2,000", "1,900", "–", "–"]}
      - {label: Investments in subsidiaries, values: ["–", "–", "3,000", "3,000"]}
      - {label: Current assets, style: section}
      - {label: Inventories, values: ["500", "480", "–", "–"]}
      - {label: Cash and cash equivalents, values: ["300", "250", "20", "15"]}
      - {id: current_assets, style: subtotal, values: ["800", "730", "20", "15"],
         sum_of: [Inventories, Cash and cash equivalents]}
      - {label: Total assets, style: total, values: ["2,800", "2,630", "3,020", "3,015"],
         sum_of: ["Property, plant and equipment", Investments in subsidiaries, current_assets]}
      - {label: Current liabilities, style: section}
      - {label: Trade and other payables, values: ["(600)", "(570)", "(40)", "(35)"]}
      - {id: current_liabilities, style: subtotal, values: ["(600)", "(570)", "(40)", "(35)"],
         sum_of: [Trade and other payables]}
      - {label: Net assets, style: total, values: ["2,200", "2,060", "2,980", "2,980"],
         sum_of: [Total assets, current_liabilities]}
      - {label: Total equity, style: total, values: ["2,200", "2,060", "2,980", "2,980"]}
expect:
  statements:
    income_statement: {pages: [2], scope: group}
    balance_sheet: {pages: [3], scope: group_and_company}
  document_type: corporate
  balance_sheet_classified: true
  currency: GBP
  unit_scale: 1000000
  periods:
    - {id: FY2025, end_date: "2025-12-31"}
    - {id: FY2024, end_date: "2024-12-31"}
  usable_columns:
    balance_sheet: [0, 1]
