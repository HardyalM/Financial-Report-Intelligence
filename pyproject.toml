[project]
name = "finintel"
version = "0.1.0"
description = "Financial Report Intelligence & RAG: deterministic statement extraction, locked ratios, grounded commentary."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.8,<3",
    "jsonschema>=4.23,<5",
    "pymupdf>=1.26",
    "pdfplumber>=0.11",
    "httpx>=0.27",
    "structlog>=24.4",
    "pyyaml>=6",
    "psycopg[binary]>=3.3.6",
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
]

[project.scripts]
finintel = "finintel.cli:main"

[project.optional-dependencies]
local = [
    "sentence-transformers>=3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-jsonschema",
    "pyyaml>=6",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finintel"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "finintel/_schemas"

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Generated from schemas/statement_pack.schema.json by `make contracts`; never edited by hand.
"finintel/contracts/statement_pack.py" = ["ALL"]
"finintel/contracts/ratio_pack.py" = ["ALL"]
"finintel/contracts/citation.py" = ["ALL"]
"finintel/contracts/commentary.py" = ["ALL"]
"finintel/contracts/reported_metric.py" = ["ALL"]
# A table of section-title regular expressions: one pattern per line is the readable form.
"finintel/narrative/sections.py" = ["E501"]
# Typographic characters are the point of these tests.
"tests/commentary/test_quotes.py" = ["RUF001"]
"finintel/commentary/validators/fields.py" = ["E501", "RUF001"]  # one field per line; dashes are the point
"finintel/db/persist.py" = ["E501"]
"finintel/cli/run_cmd.py" = ["E501"]
"finintel/review/overrides.py" = ["E501"]
"tests/api/*.py" = ["E501"]  # long literals and assertions
"finintel/api/*.py" = ["E501"]  # route signatures and SQL read best unwrapped
"tests/worker/*.py" = ["E501"]  # SQL and long assertions  # SQL statements read best on their own lines
"tests/commentary/test_fact_placeholders.py" = ["E501"]
"tests/commentary/test_figures.py" = ["E501"]
"tests/commentary/test_liquidity.py" = ["E501"]
"scripts/make_ratings_draft.py" = ["E501"]
"tests/facts/*.py" = ["E501"]  # table fixtures are laid out as printed
"tests/commentary/test_lists.py" = ["E501", "RUF001"]  # long literal fixtures, en dashes

[tool.mypy]
python_version = "3.12"
strict = true
files = ["finintel", "scripts", "tests", "evals"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# PyMuPDF's public API is only partly annotated. These modules are the typed boundary around it:
# everything they return is a typed model.
module = [
    "finintel.parse.text_layer",
    "finintel.parse.engines.pymupdf_tables_engine",
    "finintel.ingest.document",
    "tests.inspect.synthetic",
    "evals.synthetic.render",
    "scripts.make_golden_excerpt",
    "finintel.parse.ruled_tables",
    "tests.narrative.builders",
    "tests.facts.builders",
    "scripts.gate",
    "tests.e2e.fixtures.build_fixtures",
]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m \"not network\""
markers = [
    "network: test may open sockets (integration only; never in the default CI run)",
]
filterwarnings = [
    # PyMuPDF's SWIG bindings trigger these on import under Python 3.12; not actionable here.
    "ignore:builtin type Swig.* has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]
